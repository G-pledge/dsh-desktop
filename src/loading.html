<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>DeepSeek Harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111318;
        color: #e8eaed;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
      }
      .card {
        width: min(720px, 100%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 650;
      }
      p {
        margin: 0 0 18px;
        color: #b8bdc7;
        line-height: 1.6;
      }
      #status {
        color: #8ab4ff;
        font-size: 16px;
        margin-bottom: 16px;
      }
      .bar {
        height: 4px;
        background: #2a2f3a;
        overflow: hidden;
        border-radius: 99px;
        margin-bottom: 18px;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #8ab4ff;
        animation: slide 1.2s infinite linear;
      }
      pre {
        height: 220px;
        margin: 0;
        padding: 14px;
        overflow: auto;
        background: #0b0d12;
        border: 1px solid #2a2f3a;
        border-radius: 10px;
        color: #9aa3af;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>DeepSeek Harness</h1>
        <p>正在启动本地服务。第一次可能要下载几分钟，请不要关这个窗口。</p>
        <div id="status">准备启动…</div>
        <div class="bar"><span></span></div>
        <pre id="log"></pre>
      </div>
    </div>
    <script src="./loading.js"></script>
  </body>
</html>
