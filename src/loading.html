<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek Harness</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111318;
      color: #e8eaed;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .box { width: 720px; max-width: 92%; }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0 0 16px; color: #b8bdc7; }
    #status { color: #8ab4ff; margin-bottom: 14px; }
    .bar {
      height: 3px;
      background: #2a2f3a;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .bar i {
      display: block;
      width: 35%;
      height: 100%;
      background: #8ab4ff;
      animation: slide 1.1s linear infinite;
    }
    pre {
      height: 220px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      background: #0b0d12;
      border: 1px solid #2a2f3a;
      color: #9aa3af;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(340%); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>DeepSeek Harness</h1>
    <p>正在启动本地服务。第一次可能要下几分钟，别关窗口。</p>
    <div id="status">准备启动…</div>
    <div class="bar"><i></i></div>
    <pre id="log"></pre>
  </div>
  <script src="./loading.js"></script>
</body>
</html>
